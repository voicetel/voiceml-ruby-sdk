name: Publish to RubyGems

# Publishes the voiceml gem to rubygems.org on every v* tag push.
# Uses an API key stored as the RUBYGEMS_API_KEY secret at
# https://github.com/voicetel/voiceml-ruby-sdk/settings/secrets/actions
#
# To create the key:
#   1. Sign in at rubygems.org as the publisher account.
#   2. Edit Profile → API Keys → Create.
#   3. Scope: `Push rubygem` (and optionally restrict to `voiceml`).
#   4. Copy the key into the RUBYGEMS_API_KEY repo secret.
#
# Migration note: RubyGems supports Trusted Publishing (OIDC) since
# late 2024 — when ready, replace the API-key block with the OIDC
# flow per https://guides.rubygems.org/trusted-publishing/

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build gem
        run: gem build voiceml.gemspec

      - name: Publish to RubyGems
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p ~/.gem
          umask 077
          cat > ~/.gem/credentials <<EOF
          ---
          :rubygems_api_key: ${RUBYGEMS_API_KEY}
          EOF
          gem push voiceml-*.gem
