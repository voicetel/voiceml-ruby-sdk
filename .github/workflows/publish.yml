name: Publish to RubyGems

# Publishes the voiceml gem to rubygems.org on every v* tag push.
# Uses RubyGems Trusted Publishing (OIDC) — no long-lived API key.
#
# One-time setup (already done):
#   https://rubygems.org/profile/oidc/pending_trusted_publishers
#   - RubyGem Name: voiceml
#   - Repository Owner: voicetel
#   - Repository Name: voiceml-ruby-sdk
#   - Workflow Filename: publish.yml
#   - Environment: (blank)
#
# The first successful publish promotes the pending publisher to a
# live trusted publisher and claims the gem name under this account.
# Subsequent publishes reuse the same trust grant.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Configure RubyGems credentials via OIDC
        uses: rubygems/configure-rubygems-credentials@v1.0.0

      - name: Build gem
        run: gem build voiceml.gemspec

      - name: Publish to RubyGems
        run: gem push voiceml-*.gem
